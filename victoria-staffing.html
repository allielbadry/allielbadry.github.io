<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victoria Staffing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF9F4;
    --card: #FFFFFF;
    --ink: #26303B;
    --ink-soft: #6B7280;
    --line: #E8E4DA;
    --infant: #E8705F;
    --toddler: #DFA032;
    --senior: #2F9C8A;
    --flag: #D64545;
    --infant-soft: #FCEEEC;
    --toddler-soft: #FAF1DE;
    --senior-soft: #E4F2EF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  h1, h2, h3, .display { font-family: 'Bricolage Grotesque', 'Inter', sans-serif; }

  .topbar {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 20px 28px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
    position: sticky; top: 0; z-index: 10;
  }
  .topbar .logo { width: 32px; height: 32px; border-radius: 6px; }
  .topbar h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .topbar h1 span { color: var(--senior); }
  .topbar .spacer { flex: 1; }

  .month-nav { display: flex; align-items: center; gap: 8px; }
  .month-nav button {
    width: 34px; height: 34px; border: 1px solid var(--line); background: var(--card);
    border-radius: 8px; cursor: pointer; font-size: 16px; color: var(--ink);
  }
  .month-nav button:hover { background: var(--paper); }
  .month-nav select {
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 16px;
    padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--ink); cursor: pointer;
  }
  .btn-upload {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--ink);
    background: var(--ink); color: #fff; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .btn-upload:hover { opacity: .88; }
  input[type=file] { display: none; }
  .file-note { font-size: 12px; color: var(--ink-soft); }

  /* Drop zone (empty state) */
  .dropzone {
    margin: 60px auto; max-width: 520px; padding: 60px 40px;
    border: 2px dashed var(--line); border-radius: 16px; text-align: center;
    background: var(--card); cursor: pointer; transition: border-color .15s;
  }
  .dropzone.drag { border-color: var(--senior); background: var(--senior-soft); }
  .dropzone h2 { font-size: 26px; margin-bottom: 8px; letter-spacing: -0.02em; }
  .dropzone p { color: var(--ink-soft); }

  main { padding: 24px 28px 60px; max-width: 1240px; margin: 0 auto; }

  /* Summary strip */
  .summary { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 20px; min-width: 130px;
  }
  .stat .num { font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; line-height: 1.1; }
  .stat .lbl { font-size: 12px; color: var(--ink-soft); font-weight: 500; }
  .stat.g-infant { border-top: 3px solid var(--infant); }
  .stat.g-toddler { border-top: 3px solid var(--toddler); }
  .stat.g-senior { border-top: 3px solid var(--senior); }
  .stat.g-staff { border-top: 3px solid var(--ink); }

  /* Room cards */
  .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }
  .room {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
  }
  .room.over { border-color: var(--flag); box-shadow: 0 0 0 3px rgba(214,69,69,.12); }
  .room-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .room-head h3 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .room-head .range { font-size: 12px; color: var(--ink-soft); }
  .room-head .count { margin-left: auto; font-size: 13px; font-weight: 600; }
  .room-staff { font-size: 12.5px; margin-bottom: 12px; color: var(--ink-soft); }
  .room-staff b { color: var(--ink); font-size: 14px; }
  .overflag { color: var(--flag); font-weight: 600; font-size: 12.5px; }

  .dots { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; margin-bottom: 14px; max-width: 320px; }
  .dot {
    aspect-ratio: 1; border-radius: 50%;
    border: 1.5px solid var(--line); background: transparent;
  }
  .dot.filled.c-infant { background: var(--infant); border-color: var(--infant); }
  .dot.filled.c-toddler { background: var(--toddler); border-color: var(--toddler); }
  .dot.filled.c-senior { background: var(--senior); border-color: var(--senior); }
  .dot.overcap { background: var(--flag) !important; border-color: var(--flag) !important; }

  .kids { display: flex; flex-direction: column; gap: 3px; }
  .kid {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 4px 8px; border-radius: 7px; font-size: 13px;
  }
  .kid:nth-child(odd) { background: var(--paper); }
  .kid[draggable] { cursor: grab; }
  .kid.dragging { opacity: .4; }
  .room.droptarget { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(38,48,59,.10); }
  .b-moved { background: #E4E9F2; color: #3D5A99; }
  .btn-reset {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--flag);
    background: var(--card); color: var(--flag); font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .btn-reset:hover { background: #FBE7E7; }
  .btn-export {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--ink);
    background: var(--card); color: var(--ink); font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .btn-export:hover { background: var(--bg); }
  .kid .age { color: var(--ink-soft); font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; margin-left: auto; }
  .kid .name { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
  .kid.withdrawing .name { text-decoration: line-through; color: var(--ink-soft); }
  .badge {
    font-size: 10.5px; font-weight: 700; padding: 1.5px 7px; border-radius: 20px; white-space: nowrap;
  }
  .b-new { background: var(--senior-soft); color: var(--senior); }
  .b-up { background: var(--toddler-soft); color: #A9720F; }
  .b-over { background: #FBE7E7; color: var(--flag); }
  .b-grad { background: #EDE9FB; color: #6D5BC7; }
  .b-out { background: #FBE7E7; color: var(--flag); }
  .badge-cert { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; margin-left: 4px; letter-spacing: .02em; }
  .b-it  { background: #e8f0fe; color: #1a56b0; }
  .b-ece { background: #e6f4ea; color: #1e7e34; }
  .b-eca { background: #fef3e2; color: #b06000; }
  dialog#staffDlg { border: 1px solid var(--line, #ddd); border-radius: 12px; padding: 20px; min-width: 420px; }
  dialog#staffDlg::backdrop { background: rgba(0,0,0,.3); }
  .staff-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line, #eee); }
  .staff-row .meta { color: var(--ink-soft); font-size: 12px; margin-left: auto; }
  #staffAdd { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }

  .staff-strip { border-top: 1px dashed var(--line, #ddd); margin-top: 8px; padding-top: 8px; }
  .strip-head { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); margin-bottom: 6px; }
  .slots { display: flex; flex-wrap: wrap; gap: 6px; }
  .tchip { display: inline-flex; align-items: center; padding: 4px 8px; border: 1px solid var(--line, #ccc); border-radius: 8px; font-size: 12px; font-weight: 600; background: #fff; cursor: grab; }
  .tchip.overassigned { opacity: .65; border-style: dotted; }
  .slot-open { padding: 4px 12px; border: 1.5px dashed var(--ink-soft, #999); border-radius: 8px; font-size: 12px; color: var(--ink-soft); }
  .strip-status { display: flex; gap: 12px; margin-top: 6px; font-size: 11px; font-weight: 600; }
  .cstat { display: inline-flex; align-items: center; gap: 4px; }
  .dot-s { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .cstat.ok  { color: #1e7e34; } .cstat.ok  .dot-s { background: #1e7e34; }
  .cstat.bad { color: #c0392b; } .cstat.bad .dot-s { background: #c0392b; }
  .cstat.warn { color: #b06000; } .cstat.warn .dot-s { background: #b06000; }
  #bench { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; }
  #benchWrap summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--ink-soft); padding: 6px 0; }

  /* Month panel */
  .panel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; margin-top: 28px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .panel h3 { font-size: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .panel h3 .n { font-size: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 1px 9px; }
  .panel .empty { color: var(--ink-soft); font-size: 13px; }
  .prow { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--paper); font-size: 13px; flex-wrap: wrap; }
  .prow:last-child { border-bottom: none; }
  .prow .name { font-weight: 600; overflow-wrap: anywhere; }
  .prow .meta { color: var(--ink-soft); font-size: 12px; }
  .gtag { font-size: 10.5px; font-weight: 700; padding: 1.5px 8px; border-radius: 20px; }
  .gt-infant { background: var(--infant-soft); color: var(--infant); }
  .gt-toddler { background: var(--toddler-soft); color: #A9720F; }
  .gt-senior { background: var(--senior-soft); color: var(--senior); }

  .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); margin: 30px 0 12px; }

  @media (max-width: 640px) {
    .topbar, main { padding-left: 16px; padding-right: 16px; }
    .dots { grid-template-columns: repeat(8, 1fr); }
  }
  @media (prefers-reduced-motion: no-preference) {
    .room, .stat, .panel { animation: rise .25s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  }
  button:focus-visible, select:focus-visible, .dropzone:focus-visible, .btn-upload:focus-within { outline: 2px solid var(--senior); outline-offset: 2px; }
</style>
</head>

<script>
// === LOGIC START ===
const GROUPS = {
  infant:  { label: 'Infant',  range: '0–18 mo',  ratio: 4, rooms: [{ name: 'Infant Room', cap: 12 }] },
  toddler: { label: 'Toddler', range: '19–35 mo', ratio: 4, rooms: [{ name: 'Toddler 1', cap: 12 }, { name: 'Toddler 2', cap: 12 }] },
  senior:  { label: 'Senior Preschool', range: '36+ mo', ratio: 8, rooms: [{ name: 'Senior 1', cap: 25 }, { name: 'Senior 2', cap: 25 }, { name: 'Senior 3', cap: 25 }] },
};
const GROUP_ORDER = ['infant', 'toddler', 'senior'];

// Senior rooms: a full room of exactly 25 stays at 3 staff (the 25th kid
// doesn't trigger a 4th). At 26+ (over capacity) normal ratio applies.
function staffFor(group, count) {
  if (group === 'senior' && count === 25) return 3;
  return Math.ceil(count / GROUPS[group].ratio);
}

function parseCSV(text) {
  const rows = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(field); field = '';
      if (row.some(f => f.trim() !== '')) rows.push(row);
      row = [];
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); if (row.some(f => f.trim() !== '')) rows.push(row); }
  return rows;
}

function parseDate(s) { // MM/DD/YYYY -> Date or null
  if (!s || !s.trim()) return null;
  const m = s.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m ? new Date(+m[3], +m[1] - 1, +m[2]) : null;
}

function loadChildren(text) {
  const rows = parseCSV(text);
  // Raw system exports have preamble rows (Company Name, Center Name, ...) before
  // the real header — find the first row that has a DOB column.
  const hi = rows.findIndex(r => r.some(c => c.trim().toLowerCase() === 'dob'));
  if (hi < 0) return [];
  const header = rows[hi].map(h => h.trim().toLowerCase());
  const col = name => header.findIndex(h => h.includes(name));
  const iFirst = col('first name'), iLast = col('last name'),
        iName = iFirst >= 0 ? -1 : col('name'),
        iDob = col('dob'), iStart = col('start'),
        iWd = col('withdrawal date'), iWr = col('reason'), iStatus = col('status'), iProg = col('program');
  const cell = (r, i) => i >= 0 ? (r[i] || '').trim() : '';
  return rows.slice(hi + 1).map(r => ({
    name: iFirst >= 0 ? (cell(r, iFirst) + ' ' + cell(r, iLast)).trim() : cell(r, iName),
    program: cell(r, iProg),
    dob: parseDate(cell(r, iDob)), start: parseDate(cell(r, iStart)),
    withdrawal: parseDate(cell(r, iWd)),
    reason: cell(r, iWr),
    status: cell(r, iStatus),
  })).filter(c => c.name && c.dob);
}

function monthEnd(y, m) { return new Date(y, m + 1, 0); }

function ageMonths(dob, date) {
  let months = (date.getFullYear() - dob.getFullYear()) * 12 + (date.getMonth() - dob.getMonth());
  if (date.getDate() < dob.getDate()) months--;
  return Math.max(0, months);
}

function groupFor(months) {
  if (months <= 18) return 'infant';
  if (months <= 35) return 'toddler';
  return 'senior';
}

function sameMonth(d, y, m) { return d && d.getFullYear() === y && d.getMonth() === m; }

// Snapshot of the campus for a viewed month (y, m 0-based)
function snapshot(children, y, m) {
  const end = monthEnd(y, m);
  const prevEnd = monthEnd(m === 0 ? y - 1 : y, m === 0 ? 11 : m - 1);
  const present = [], future = [];
  for (const c of children) {
    if (!c.start) continue;
    const withdrawnBefore = c.withdrawal && (c.withdrawal.getFullYear() * 12 + c.withdrawal.getMonth()) < (y * 12 + m);
    if (withdrawnBefore) continue;
    const age = ageMonths(c.dob, end);
    const group = groupFor(age);
    if (c.start > end) {
      future.push({ ...c, ageAtStart: ageMonths(c.dob, c.start), groupAtStart: groupFor(ageMonths(c.dob, c.start)) });
      continue;
    }
    const startedBefore = c.start <= prevEnd;
    const prevGroup = startedBefore ? groupFor(ageMonths(c.dob, prevEnd)) : null;
    present.push({
      ...c, age, group,
      starting: sameMonth(c.start, y, m),
      agedUp: startedBefore && prevGroup !== group,
      withdrawing: sameMonth(c.withdrawal, y, m),
    });
  }
  // fill-first room assignment: oldest first within each group
  const rooms = [];
  for (const g of GROUP_ORDER) {
    const kids = present.filter(k => k.group === g).sort((a, b) => b.age - a.age || a.name.localeCompare(b.name));
    const defs = GROUPS[g].rooms;
    let idx = 0;
    defs.forEach((def, di) => {
      const isLast = di === defs.length - 1;
      const take = isLast ? kids.length - idx : Math.min(def.cap, kids.length - idx);
      const assigned = kids.slice(idx, idx + Math.max(0, take));
      idx += assigned.length;
      // over-capacity = kids beyond this room's cap (only possible in last room)
      assigned.forEach((k, ki) => { k.overCapacity = ki >= def.cap; });
      rooms.push({
        group: g, name: def.name, cap: def.cap, kids: assigned,
        over: assigned.length > def.cap,
        staff: staffFor(g, assigned.length),
      });
    });
  }
  future.sort((a, b) => a.start - b.start);
  return { present, future, rooms };
}

// Alberta cert rule: infant rooms need an IT-certified teacher; toddler and
// senior rooms need an ECE. ECA fills a slot but never satisfies the rule.
const REQUIRED_CERT = { infant: 'IT', toddler: 'ECE', senior: 'ECE' };
function certStatus(group, teacherList) {
  const need = REQUIRED_CERT[group];
  return { met: teacherList.some(t => (t.certs || []).includes(need)), need };
}
// === LOGIC END ===

// ---------- UI ----------
const $ = id => document.getElementById(id);
let children = [], viewY, viewM;
let overrides = {}; // kid key -> room name (custom what-if view)
const kidKey = k => k.name + '|' + (k.dob ? k.dob.getTime() : '');
function saveOverrides() { try { localStorage.setItem('victoria-overrides', JSON.stringify(overrides)); } catch (e) {} }
let teachers = [];          // { id, name, certs: [] }
let staffAssign = {};       // teacherId -> room name; absent = bench
function saveStaff() {
  try {
    localStorage.setItem('victoria-teachers', JSON.stringify(teachers));
    localStorage.setItem('victoria-staff-assign', JSON.stringify(staffAssign));
  } catch (e) {}
}

// Re-seat overridden kids, then recompute staff/over flags per room.
// Ratio is fixed per room, regardless of which kids are dragged in.
// An override is a persistent pin: it survives month changes and reloads.
// Pins to the same or an older group are allowed (manual early promotion);
// once the kid naturally ages PAST the pinned room's group, the pin is
// ignored — natural aging up always wins, and never pins a kid backward.
function applyOverrides(snap) {
  const gi = g => GROUP_ORDER.indexOf(g);
  const moves = [];
  for (const room of snap.rooms) {
    room.kids = room.kids.filter(k => {
      const dest = snap.rooms.find(r => r.name === overrides[kidKey(k)]);
      if (dest && dest !== room && gi(dest.group) >= gi(k.group)) { moves.push([k, dest]); return false; }
      return true;
    });
  }
  for (const [k, dest] of moves) { k.moved = true; dest.kids.push(k); }
  const active = Object.keys(overrides).length > 0;
  for (const room of snap.rooms) {
    room.kids.sort((a, b) => b.age - a.age || a.name.localeCompare(b.name));
    // over-capacity blame: pinned-in kids first (youngest of them), then youngest naturals
    room.kids.forEach(k => { k.overCapacity = false; });
    const overflow = room.kids.length - room.cap;
    if (overflow > 0) {
      const moved = room.kids.filter(k => k.moved), natural = room.kids.filter(k => !k.moved);
      const flagged = moved.slice(Math.max(0, moved.length - overflow));
      const rem = overflow - flagged.length;
      if (rem > 0) flagged.push(...natural.slice(natural.length - rem));
      flagged.forEach(k => { k.overCapacity = true; });
    }
    room.over = room.kids.length > room.cap;
    room.staff = staffFor(room.group, room.kids.length);
  }
  $('resetView').hidden = !active;
  return snap;
}
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmtDate = d => d ? `${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}, ${d.getFullYear()}` : '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function setData(text) {
  children = loadChildren(text);
  if (!children.length) { alert('No valid rows found — check the CSV columns.'); return; }
  try { localStorage.setItem('victoria-csv', text); } catch (e) {}
  const now = new Date();
  viewY = now.getFullYear(); viewM = now.getMonth();
  buildMonthOptions();
  $('dropzone').hidden = true; $('app').hidden = false; $('monthNav').hidden = false; $('exportX').hidden = false; $('staffBtn').hidden = false;
  render();
}

function buildMonthOptions() {
  const now = new Date();
  let maxKey = now.getFullYear() * 12 + now.getMonth();
  for (const c of children) if (c.start) maxKey = Math.max(maxKey, c.start.getFullYear() * 12 + c.start.getMonth());
  maxKey += 2;
  const sel = $('monthSel'); sel.innerHTML = '';
  for (let k = now.getFullYear() * 12 + now.getMonth(); k <= maxKey; k++) {
    const y = Math.floor(k / 12), m = k % 12;
    const o = document.createElement('option');
    o.value = `${y}-${m}`; o.textContent = `${MONTHS[m]} ${y}`;
    sel.appendChild(o);
  }
  sel.value = `${viewY}-${viewM}`;
}

function shiftMonth(d) {
  const sel = $('monthSel'), opts = [...sel.options], i = opts.findIndex(o => o.value === sel.value) + d;
  if (i >= 0 && i < opts.length) { sel.value = opts[i].value; onMonthChange(); }
}
function onMonthChange() { const [y, m] = $('monthSel').value.split('-').map(Number); viewY = y; viewM = m; render(); }

function kidBadges(k) {
  let b = '';
  if (k.starting) b += `<span class="badge b-new">🟢 just started · ${fmtDate(k.start)}</span>`;
  if (k.agedUp) b += `<span class="badge b-up">↑ aged up</span>`;
  if (k.age >= 60 && k.age <= 72) b += `<span class="badge b-grad">possible graduation</span>`;
  if (k.overCapacity) b += `<span class="badge b-over">over capacity</span>`;
  if (k.withdrawing) b += `<span class="badge b-out">↳ leaves ${fmtDate(k.withdrawal)}</span>`;
  return b;
}

function render() {
  const snap = applyOverrides(snapshot(children, viewY, viewM));
  const monthName = `${MONTHS[viewM]} ${viewY}`;
  const byGroup = g => snap.present.filter(k => k.group === g).length;
  const totalStaff = snap.rooms.reduce((s, r) => s + r.staff, 0);

  $('summary').innerHTML = `
    <div class="stat g-infant"><div class="num">${byGroup('infant')}</div><div class="lbl">Infants (1:4)</div></div>
    <div class="stat g-toddler"><div class="num">${byGroup('toddler')}</div><div class="lbl">Toddlers (1:4)</div></div>
    <div class="stat g-senior"><div class="num">${byGroup('senior')}</div><div class="lbl">Seniors (1:8)</div></div>
    <div class="stat"><div class="num">${snap.present.length}</div><div class="lbl">Kids in ${esc(monthName)}</div></div>
    <div class="stat g-staff"><div class="num">${totalStaff}</div><div class="lbl">Staff required</div></div>`;

  $('rooms').innerHTML = snap.rooms.map(r => {
    const dots = Array.from({ length: Math.max(r.cap, r.kids.length) }, (_, i) => {
      const filled = i < r.kids.length;
      const over = i >= r.cap;
      return `<div class="dot ${filled ? 'filled c-' + r.group : ''} ${filled && over ? 'overcap' : ''}"></div>`;
    }).join('');
    const kids = r.kids.map(k => `
      <div class="kid ${k.withdrawing ? 'withdrawing' : ''}" draggable="true" data-kid="${esc(kidKey(k))}">
        <span class="name">${esc(k.name)}</span>${k.moved ? '<span class="badge b-moved">moved</span>' : ''}${kidBadges(k)}
        <span class="age">${k.age} mo</span>
      </div>`).join('');
    const roomTeachers = teachers.filter(t => staffAssign[t.id] === r.name);
    const cert = certStatus(r.group, roomTeachers);
    const openSlots = Math.max(0, r.staff - roomTeachers.length);
    const tchip = t => `<div class="tchip" draggable="true" data-tid="${esc(t.id)}">${esc(t.name)}${certBadges(t)}</div>`;
    const strip = r.kids.length === 0 ? '' : `
      <div class="staff-strip">
        <div class="strip-head">Staff <span class="meta">needs ${r.staff}</span></div>
        <div class="slots">
          ${roomTeachers.map((t, i) => i < r.staff ? tchip(t) : tchip(t).replace('class="tchip"', 'class="tchip overassigned"')).join('')}
          ${Array.from({ length: openSlots }, () => '<div class="slot-open">open</div>').join('')}
        </div>
        <div class="strip-status">
          <span class="cstat ${cert.met ? 'ok' : 'bad'}"><span class="dot-s"></span>${cert.met ? `${cert.need} covered` : `needs ${cert.need} cert`}</span>
          ${openSlots ? `<span class="cstat warn"><span class="dot-s"></span>needs ${openSlots} more</span>` : ''}
          ${roomTeachers.length > r.staff ? `<span class="cstat warn"><span class="dot-s"></span>${roomTeachers.length - r.staff} over</span>` : ''}
        </div>
      </div>`;
    return `
      <div class="room ${r.over ? 'over' : ''}" data-room="${esc(r.name)}">
        <div class="room-head"><h3>${r.name}</h3><span class="range">${GROUPS[r.group].range}</span>
          <span class="count">${r.kids.length}/${r.cap}</span></div>
        <div class="room-staff">Staff needed: <b>${r.staff}</b>
          ${r.over ? `<span class="overflag"> · ⚠ ${r.kids.length - r.cap} over capacity</span>` : ''}</div>
        <div class="dots">${dots}</div>
        <div class="kids">${kids || '<div class="empty" style="color:var(--ink-soft)">Empty</div>'}</div>
        ${strip}
      </div>`;
  }).join('');

  $('panelTitle').textContent = `Happening in ${monthName}`;
  const ups = snap.present.filter(k => k.agedUp);
  const outs = snap.present.filter(k => k.withdrawing);
  const gtag = g => `<span class="gtag gt-${g}">${GROUPS[g].label}</span>`;
  const panel = (title, items, rowFn) => `
    <div class="panel"><h3>${title} <span class="n">${items.length}</span></h3>
      ${items.length ? items.map(rowFn).join('') : '<div class="empty">Nothing this month</div>'}</div>`;

  $('panels').innerHTML =
    panel('↑ Aging up', ups, k => `<div class="prow"><span class="name">${esc(k.name)}</span>${gtag(k.group)}
      <span class="meta">now ${k.age} mo</span></div>`) +
    panel('Withdrawing', outs, k => `<div class="prow"><span class="name">${esc(k.name)}</span>${gtag(k.group)}
      <span class="meta">${fmtDate(k.withdrawal)} — ${esc(k.reason || 'no reason given')}</span></div>`) +
    panel('Starting soon (reserved)', snap.future, k => `<div class="prow"><span class="name">${esc(k.name)}</span>${gtag(k.groupAtStart)}
      <span class="meta">starts ${fmtDate(k.start)}</span></div>`);

  const benched = teachers.filter(t => !staffAssign[t.id] || !snap.rooms.some(r => r.name === staffAssign[t.id] && r.kids.length > 0));
  $('benchTitle').textContent = `Bench (${benched.length} unassigned)`;
  $('bench').innerHTML = benched.map(t => `<div class="tchip" draggable="true" data-tid="${esc(t.id)}">${esc(t.name)}${certBadges(t)}</div>`).join('')
    || '<div class="empty">Everyone is assigned</div>';
  $('benchWrap').hidden = teachers.length === 0;
}

// wiring
$('fileInput').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) f.text().then(setData);
});
const dz = $('dropzone');
dz.addEventListener('click', () => $('fileInput').click());
dz.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') $('fileInput').click(); });
['dragover', 'dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); }));
['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag'); }));
dz.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) f.text().then(setData);
});
// drag kids between rooms (custom what-if view); drag teachers between rooms/bench
const roomsEl = $('rooms');
function chipDragStart(e) {
  const chip = e.target.closest('.tchip');
  if (chip) { e.dataTransfer.setData('text/plain', 'T:' + chip.dataset.tid); e.dataTransfer.effectAllowed = 'move'; return true; }
  return false;
}
$('bench').addEventListener('dragstart', chipDragStart);
roomsEl.addEventListener('dragstart', e => {
  if (chipDragStart(e)) return;
  const kid = e.target.closest('.kid');
  if (!kid) return;
  e.dataTransfer.setData('text/plain', kid.dataset.kid);
  e.dataTransfer.effectAllowed = 'move';
  kid.classList.add('dragging');
});
roomsEl.addEventListener('dragend', e => {
  const kid = e.target.closest('.kid');
  if (kid) kid.classList.remove('dragging');
});
roomsEl.addEventListener('dragover', e => {
  const room = e.target.closest('.room');
  if (!room) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  roomsEl.querySelectorAll('.room.droptarget').forEach(r => r.classList.remove('droptarget'));
  room.classList.add('droptarget');
});
roomsEl.addEventListener('dragleave', e => {
  const room = e.target.closest('.room');
  if (room && !room.contains(e.relatedTarget)) room.classList.remove('droptarget');
});
roomsEl.addEventListener('drop', e => {
  const room = e.target.closest('.room');
  if (!room) return;
  e.preventDefault();
  const key = e.dataTransfer.getData('text/plain');
  if (key.startsWith('T:')) {
    staffAssign[key.slice(2)] = room.dataset.room;
    saveStaff(); render();
    return;
  }
  if (key) { overrides[key] = room.dataset.room; saveOverrides(); render(); }
});
const benchWrap = $('benchWrap');
benchWrap.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
benchWrap.addEventListener('drop', e => {
  const key = e.dataTransfer.getData('text/plain');
  if (!key.startsWith('T:')) return;
  e.preventDefault();
  delete staffAssign[key.slice(2)];
  saveStaff(); render();
});
$('resetView').addEventListener('click', () => { overrides = {}; saveOverrides(); render(); });

const CERTS = ['IT', 'ECE', 'ECA'];
const certBadges = t => (t.certs || []).map(c => `<span class="badge-cert b-${c.toLowerCase()}">${c}</span>`).join('');
function renderStaffList() {
  $('staffList').innerHTML = teachers.map(t => `
    <div class="staff-row" data-tid="${esc(t.id)}">
      <span class="name">${esc(t.name)}</span>${certBadges(t)}
      <span class="meta">${staffAssign[t.id] ? esc(staffAssign[t.id]) : 'bench'}</span>
      ${CERTS.map(c => `<label><input type="checkbox" data-cert="${c}" ${(t.certs||[]).includes(c) ? 'checked' : ''}>${c}</label>`).join('')}
      <button type="button" data-rename>Rename</button>
      <button type="button" data-del>Remove</button>
    </div>`).join('') || '<div class="empty">No teachers yet</div>';
}
$('staffBtn').addEventListener('click', () => { renderStaffList(); $('staffDlg').showModal(); });
$('staffClose').addEventListener('click', () => $('staffDlg').close());
$('staffAdd').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('tName').value.trim();
  if (!name) return;
  const certs = [...$('staffAdd').querySelectorAll('input[type=checkbox]:checked')].map(c => c.value);
  teachers.push({ id: crypto.randomUUID(), name, certs });
  e.target.reset();
  saveStaff(); renderStaffList(); render();
});
$('staffList').addEventListener('click', e => {
  const row = e.target.closest('.staff-row'); if (!row) return;
  const t = teachers.find(x => x.id === row.dataset.tid); if (!t) return;
  if (e.target.hasAttribute('data-del')) {
    teachers = teachers.filter(x => x.id !== t.id);
    delete staffAssign[t.id];
  } else if (e.target.hasAttribute('data-rename')) {
    const name = prompt('Rename teacher', t.name);
    if (name === null || !name.trim()) return;
    t.name = name.trim();
  } else if (e.target.dataset.cert) {
    const c = e.target.dataset.cert;
    t.certs = e.target.checked ? [...new Set([...(t.certs||[]), c])] : (t.certs||[]).filter(x => x !== c);
  } else return;
  saveStaff(); renderStaffList(); render();
});

// ---------- Excel export (no libraries: minimal .xlsx = zip of XML parts, stored/uncompressed) ----------
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c; }
  return t;
})();
function crc32(bytes) { let c = ~0; for (const b of bytes) c = CRC_TABLE[(c ^ b) & 0xFF] ^ (c >>> 8); return ~c >>> 0; }

// ponytail: stored (no-compression) zip — files are tiny; add deflate only if size ever matters
function makeZip(files) { // files: [name, xmlString][]
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const [name, content] of files) {
    const nb = enc.encode(name), db = enc.encode(content), crc = crc32(db);
    const local = new Uint8Array(30 + nb.length), lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true);
    lv.setUint32(14, crc, true); lv.setUint32(18, db.length, true); lv.setUint32(22, db.length, true);
    lv.setUint16(26, nb.length, true);
    local.set(nb, 30);
    const cd = new Uint8Array(46 + nb.length), cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, db.length, true); cv.setUint32(24, db.length, true);
    cv.setUint16(28, nb.length, true); cv.setUint32(42, offset, true);
    cd.set(nb, 46);
    parts.push(local, db); central.push(cd);
    offset += local.length + db.length;
  }
  const cdSize = central.reduce((s, c) => s + c.length, 0);
  const end = new Uint8Array(22), ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

function sheetXML(rows) { // numbers -> number cells, everything else -> inline string
  const cell = v => typeof v === 'number'
    ? `<c><v>${v}</v></c>`
    : `<c t="inlineStr"><is><t xml:space="preserve">${esc(String(v ?? ''))}</t></is></c>`;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>` +
    rows.map(r => `<row>${r.map(cell).join('')}</row>`).join('') +
    `</sheetData></worksheet>`;
}

function exportExcel() {
  const snap = applyOverrides(snapshot(children, viewY, viewM));
  const monthName = `${MONTHS[viewM]} ${viewY}`;
  const sheets = snap.rooms.filter(r => r.kids.length).map(r => ({
    name: r.name,
    rows: [
      [`${r.name} — ${monthName}`],
      ['Group', GROUPS[r.group].label + ' (' + GROUPS[r.group].range + ')'],
      ['Staff required', r.staff],
      ['Assigned Teacher', ''],
      [],
      ['Child Name', 'Group', 'Age (months)'],
      ...r.kids.map(k => [k.name, GROUPS[k.group].label, k.age]),
    ],
  }));
  if (!sheets.length) { alert('No kids in the viewed month — nothing to export.'); return; }

  const files = [
    ['[Content_Types].xml',
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">` +
      `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>` +
      `<Default Extension="xml" ContentType="application/xml"/>` +
      `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>` +
      sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') +
      `</Types>`],
    ['_rels/.rels',
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
      `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>` +
      `</Relationships>`],
    ['xl/workbook.xml',
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>` +
      sheets.map((s, i) => `<sheet name="${esc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') +
      `</sheets></workbook>`],
    ['xl/_rels/workbook.xml.rels',
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
      sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +
      `</Relationships>`],
    ...sheets.map((s, i) => [`xl/worksheets/sheet${i + 1}.xml`, sheetXML(s.rows)]),
  ];

  const url = URL.createObjectURL(makeZip(files));
  const a = document.createElement('a');
  a.href = url;
  a.download = `Victoria Staffing ${monthName}.xlsx`;
  a.click();
  URL.revokeObjectURL(url);
}
$('exportX').addEventListener('click', exportExcel);

$('monthSel').addEventListener('change', onMonthChange);
$('prevM').addEventListener('click', () => shiftMonth(-1));
$('nextM').addEventListener('click', () => shiftMonth(1));

// restore last upload + saved custom view
try { teachers = JSON.parse(localStorage.getItem('victoria-teachers')) || []; } catch (e) { teachers = []; }
try { staffAssign = JSON.parse(localStorage.getItem('victoria-staff-assign')) || {}; } catch (e) { staffAssign = {}; }
try {
  overrides = JSON.parse(localStorage.getItem('victoria-overrides')) || {};
  const saved = localStorage.getItem('victoria-csv');
  if (saved) setData(saved);
} catch (e) {}
</script>
</body>
</html>
